services:
  app:
    image: todo-app:v1
    ports:
      - "3001:3000"
    networks:
      - todo-net
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DB: todos
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    networks:
      - todo-net
    volumes:
      - todo-mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: todos

networks:
  todo-net:
    external: true

volumes:
  todo-mysql-data:
    external: true
